# OpenCues tmux wrapper config — loaded by ``oc-shell``.
#
# This file is private to `oc-shell` and does NOT touch ~/.tmux.conf.
# `oc-shell` launches tmux with `-L opencues-<pid> -f <this file>` so the
# user's existing tmux server and config are untouched.

# ─── Terminal capabilities ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB"
set -g allow-passthrough on

# ─── Mouse + behaviour ──────────────────────────────────────────────
set -g mouse on
set -g remain-on-exit off
set -g history-limit 50000
# Note: no `destroy-unattached`. bin/`oc-shell`'s EXIT trap kills the
# tmux server and daemon when the script returns, which covers normal
# exit + Ctrl+Alt+Q kill-session. We previously had `on` here but it
# raced with the in-session setup (split-window) when the session was
# briefly clientless during `oc-shell` startup.

# ─── Pane border ────────────────────────────────────────────────────
# The border row only exists when the input pane is open (lazy-spawn
# layout). Render the `─` character in black on the terminal's
# default background, so it shows as a thin black line — NOT a solid
# bar (we'd get a bar if bg was also black). Same style for active
# and inactive so focus changes don't flicker the colour.
set -g pane-border-style 'fg=black bg=default'
set -g pane-active-border-style 'fg=black bg=default'

# ─── No prefix (`oc-shell` does not expose tmux features) ─────────────
# Passes Ctrl+B through to readline / the running app instead of
# putting tmux into a prefix-waiting state.
set -g prefix None
unbind C-b

# ─── Status line (brand bar at terminal bottom) ────────────────────
# Status bar is owned by TMUX, not opentui. It shows the OpenCues
# brand block + keybinding strip at the very bottom of the terminal,
# below the oc-input pane. Because tmux draws it (not the bun
# renderer), it never flashes/redraws when:
#   • opentui enters/exits alt-screen on first activate (respawn-pane)
#   • opentui repaints on pane resize (activate / deactivate)
# Always visible.
set -g status on
set -g status-position bottom
# 1-second refresh so the "Submit" label appears/disappears without
# lag as focus moves between the shell and oc-input panes.
# Pane-active changes also trigger a redraw, so this is a safety net.
set -g status-interval 1
set -g status-style 'bg=#1a1a1a fg=#ffffff'
set -g status-justify left
# Brand block, then a stable keybinding strip. "Input Box" is always
# shown in a fixed position; the trailing label swaps based on focus:
#   • shell pane    → trailing "Exit: Alt+Shift+←"
#   • oc-input pane → trailing "Submit: Alt+Shift+→"
# All four advertised chords use Alt+Shift+arrow so the user's
# fingers stay on the same modifiers. Ctrl+S / Ctrl+Alt+S / Ctrl+Q /
# Esc / Ctrl+Alt+X stay bound as silent aliases.
set -g status-left ' #[reverse]#[bold]#[fg=brightwhite]C_#[default] #[fg=brightwhite]#[bold]OpenCues_#[default]  ·  Input Box: alt+shift+↑/↓#{?#{==:#{pane_title},oc-input},   ·   Submit: alt+shift+→,   ·   Exit: alt+shift+←}'
set -g status-left-length 120
set -g status-right ''
set -g status-right-length 0
set -g window-status-format ''
set -g window-status-current-format ''

# ─── Slide-pane binding ─────────────────────────────────────────────
# Ctrl+Alt+S is a SINGLE chord that means "Input Box" — what happens
# depends on which pane has focus when it's pressed.
#
#   • Focus is in the shell pane (top): grow the keep-alive pane from
#     1 row to 15 rows and switch focus to it. The bun process running
#     `oc-edit --keep-alive` was spawned at `oc-shell` startup and has
#     been waiting in the background — the "popup" is just a tmux
#     resize. Sub-millisecond.
#
#   • Focus is already in the oc-input pane: re-send the chord (as the
#     raw byte sequence ESC + Ctrl-S) into the pane so oc-edit's
#     keyboard handler can fire its submit logic. That logic injects
#     the textarea contents into the originating shell pane via
#     `tmux send-keys`, clears the textarea, then runs `resize-pane
#     -y 1 ; select-pane -t <target>` to slide itself back down.
#
# From the shell pane: split-window creates a 15-row oc-input pane
# at the bottom and runs oc-edit there. split-window makes the new
# pane active by default, so opentui's terminal-feature queries
# route into the now-focused oc-input pane (no leak into the shell).
# We tag the new pane title 'oc-input' so this same binding takes
# the submit branch on the next press.
#
# From the oc-input pane: forward Esc+C-s into the pane so oc-edit's
# keyboard handler can fire its submit logic. On submit oc-edit kills
# its own pane (see deactivate() in src/app.tsx), restoring the idle
# layout (shell pane + brand bar, nothing else).
bind-key -n M-C-s if-shell -F '#{==:#{pane_title},oc-input}' \
  'send-keys Escape C-s' \
  'send-keys M-m ; run-shell -b "$OPENCUES_OC_OPEN_INPUT"'

# Same semantics for F2 (fallback for emulators that grab Ctrl+Alt+S).
bind-key -n F2 if-shell -F '#{==:#{pane_title},oc-input}' \
  'send-keys Escape C-s' \
  'send-keys M-m ; run-shell -b "$OPENCUES_OC_OPEN_INPUT"'

# ─── Alt+Shift+Arrow — directional bindings ────────────────────────
# All four core actions on the same modifier+arrow group so the
# user's fingers don't have to move between chords. Directional
# metaphor:
#   ↑  open  the input box  (shell → input)
#   ↓  close + discard      (input → shell, no paste)
#   →  submit               (input → shell, paste)
#   ←  exit                 (kill the whole `oc-shell` session)
#
# Each binding is gated on pane_title so accidental presses in the
# wrong pane no-op rather than do something destructive (e.g.
# Alt+Shift+← in the input pane doesn't kill-session).
bind-key -n M-S-Up if-shell -F '#{!=:#{pane_title},oc-input}' \
  'send-keys M-m ; run-shell -b "$OPENCUES_OC_OPEN_INPUT"'

# Send Esc+Ctrl-q (the same byte sequence as Ctrl+Alt+Q) so oc-edit's
# keyboard handler fires finish('', 130). That path runs the
# restoreOnCancel logic — re-pasting the originally-captured shell
# line back into the shell pane — before killing the pane. A bare
# `kill-pane` here would skip that and leave the prompt empty.
bind-key -n M-S-Down if-shell -F '#{==:#{pane_title},oc-input}' \
  'send-keys Escape C-q'

# Submit: forward Esc+C-s into the input pane so oc-edit's keyboard
# handler fires its existing submit logic (inject text + kill-pane).
# Sending the M-C-s byte sequence (\x1b\x13) instead of plain C-s
# avoids any chance of the bare Ctrl+S being eaten by terminal
# flow-control (XOFF) before opentui reads it.
bind-key -n M-S-Right if-shell -F '#{==:#{pane_title},oc-input}' \
  'send-keys Escape C-s'

# Exit: kill-session, but only from the shell pane.
bind-key -n M-S-Left if-shell -F '#{!=:#{pane_title},oc-input}' \
  'kill-session'

# ─── Exit + cancel bindings ─────────────────────────────────────────
# Ctrl+Alt+X exits the whole `oc-shell` session. It only fires from
# the shell pane; in the oc-input pane it's a no-op so an accidental
# press while editing doesn't kill the session.
#
# Ctrl+Alt+Q cancels the input box (clears textarea + closes pane).
# Only fires from the input pane; ignored from the shell pane (where
# there's nothing to cancel). Same as Esc / Ctrl+Q aliases.
bind-key -n M-C-x if-shell -F '#{!=:#{pane_title},oc-input}' \
  'kill-session'

bind-key -n M-C-q if-shell -F '#{==:#{pane_title},oc-input}' \
  'send-keys Escape C-q'
