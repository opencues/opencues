# OpenCues tmux wrapper config — loaded by `oc-shell`.
#
# This file is private to oc-shell and does NOT touch ~/.tmux.conf.
# oc-shell launches tmux with `-L opencues-<pid> -f <this file>` so the
# user's existing tmux server and config are untouched.

# ─── Terminal capabilities ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB"
set -g allow-passthrough on

# ─── Mouse + behaviour ──────────────────────────────────────────────
set -g mouse on
set -g destroy-unattached on
set -g remain-on-exit off
set -g history-limit 50000

# ─── No prefix (oc-shell does not expose tmux features) ─────────────
# Passes Ctrl+B through to readline / the running app instead of
# putting tmux into a prefix-waiting state.
set -g prefix None
unbind C-b

# ─── Status line ────────────────────────────────────────────────────
# Status line is ON so users can see how to exit during this early
# build. It's a thin one-liner at the bottom of the screen.
#
# TO REMOVE THE STATUS LINE LATER:
#   1. Change "set -g status on" to "set -g status off" below.
#      That's it — the rest of the status-* lines become inert.
#   2. (Optional) delete the status-style / status-right lines for
#      tidiness; they have no effect when status is off.
#
# With status off the wrapped session is visually indistinguishable
# from a plain terminal (one $TMUX env var still leaks; see oc-shell
# for notes).
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1a1a1a fg=#888888'
set -g status-justify left
# Brand block (reverse-video bright-white badge + bright-white
# wordmark) followed by the outer keybinding strip. The WHOLE bar
# disappears when oc-popup is showing — the inner statusline
# carries its own brand + a different keybinding strip
# ("Submit/Cancel" vs the outer's "Input Box/Exit"), so visually
# the bar appears to "jump" from the bottom of the screen up into
# the popup as it opens.
#
# Leading space inset so the bar sits one column inside the
# terminal edge — mirrors the popup's paddingLeft/Right.
set -g status-left '#{?@popup-open,, #[reverse]#[bold]#[fg=brightwhite]C_#[default] #[fg=brightwhite]OpenCues_#[default]  ·  #[fg=brightwhite]Input Box: Ctrl+Alt+S   ·   Exit: Ctrl+Alt+Q#[default]}'
set -g status-left-length 120
# Status-right intentionally empty — the keybinding strip moved
# left next to the brand block, separated by a middle dot.
set -g status-right ''
set -g status-right-length 80
set -g window-status-format ''
set -g window-status-current-format ''

# ─── Popup binding ──────────────────────────────────────────────────
# Ctrl+Alt+X opens the OpenCues popup as a centered floating box,
# sized 80% wide × 70% tall (enough room for multi-line composition).
# The popup runs `oc-popup <originating-pane-id>`, which invokes
# oc-edit; on commit the result is bracket-pasted into the pane the
# user invoked from.
#
# `-n`         = root key-table (no prefix needed)
# `-E`         = close the popup automatically when the command exits
# `-w / -h`    = popup geometry as % of the terminal size
# `-d ...`     = open the popup in the same CWD as the originating pane
# `#{pane_id}` = format string resolved against the originating pane
# tmux 3.4 does NOT format-expand `#{...}` inside `-e KEY=VALUE`,
# nor inside the quoted shell-command argument to display-popup.
# It DOES expand inside the command string of `run-shell`. So we
# wrap the display-popup call in run-shell — by the time the inner
# tmux command runs, `#{pane_id}` has already been substituted with
# the real id (e.g. `%0`) and is baked into the env-prefix of the
# popup command: `ORIGIN_PANE=%0 oc-popup`.
#
# Use $OPENCUES_TMUX (exported by oc-shell) so the inner command
# talks to OUR socket — not the system tmux, which may be on PATH
# and would try to attach to the default socket.
bind-key -n M-C-s run-shell -b \
  '$OPENCUES_TMUX display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "ORIGIN_PANE=#{pane_id} oc-popup"'

# Fallback binding for terminal emulators that intercept Ctrl+Alt+S
# (rare — VS Code's integrated terminal might claim it for "Save").
# F2 is rarely claimed by emulators or shells.
bind-key -n F2 run-shell -b \
  '$OPENCUES_TMUX display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "ORIGIN_PANE=#{pane_id} oc-popup"'

# ─── Exit binding ───────────────────────────────────────────────────
# Ctrl+Alt+Q kills the wrapped session and returns the user to the
# shell they ran `oc-shell` from. Matches the inner popup's cancel
# binding so both layers use the same chord for the same semantic
# action (submit/cancel are Ctrl+Alt+S/Ctrl+Alt+Q everywhere).
# Modifier-prefixed so it doesn't clobber inner TUIs that need
# Esc / plain Ctrl+Q / XON flow control.
bind-key -n M-C-q kill-session
