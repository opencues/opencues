<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Generic contenteditable — undo harness</title>
  </head>
  <body>
    <div id="editor" contenteditable="true" style="border: 1px solid #ccc; padding: 8px; min-height: 40px;">
      original body
    </div>
    <script src="../test-bundle.js"></script>
    <script>
      // Boot: hand the editor to the runtime so currentTarget is set.
      const el = document.getElementById('editor');
      el.focus();
      window.__OC.publishTarget(el);
    </script>
  </body>
</html>
