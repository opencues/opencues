<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OpenCues E2E — textarea</title>
  </head>
  <body>
    <h1>textarea page</h1>
    <!-- Normal-input profile: plain textarea. Single-answer blanks only. -->
    <textarea id="t" rows="6" cols="60" aria-label="notes"></textarea>

    <!-- A sensitive field, for the sensitive-field-refusal security test. -->
    <input id="pw" type="password" aria-label="password" />
    <input id="cc" type="text" name="cc-number" autocomplete="cc-number" aria-label="card" />
  </body>
</html>
