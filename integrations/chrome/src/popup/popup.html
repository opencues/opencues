<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>OpenCues</h1>

    <fieldset style="border:1px solid #333;padding:8px 10px 4px;margin:8px 0">
      <legend style="font-size:12px;color:#888;padding:0 4px">LLM Provider Keys</legend>
      <p style="font-size:11px;color:#888;margin:0 0 6px">
        Leave blank if <code>opencues install chrome-host</code> is forwarding them from your shell env.
        Pasted keys win on collision.
      </p>

      <label for="key_GROQ_API_KEY">Groq</label>
      <input type="password" id="key_GROQ_API_KEY" data-provider-key="GROQ_API_KEY" placeholder="gsk_...">

      <label for="key_CEREBRAS_API_KEY">Cerebras</label>
      <input type="password" id="key_CEREBRAS_API_KEY" data-provider-key="CEREBRAS_API_KEY" placeholder="csk-...">

      <label for="key_OPENAI_API_KEY">OpenAI</label>
      <input type="password" id="key_OPENAI_API_KEY" data-provider-key="OPENAI_API_KEY" placeholder="sk-...">

      <label for="key_ANTHROPIC_API_KEY">Anthropic</label>
      <input type="password" id="key_ANTHROPIC_API_KEY" data-provider-key="ANTHROPIC_API_KEY" placeholder="sk-ant-...">

      <label for="key_GEMINI_API_KEY">Gemini</label>
      <input type="password" id="key_GEMINI_API_KEY" data-provider-key="GEMINI_API_KEY" placeholder="AI...">

      <label for="key_OPENROUTER_API_KEY">OpenRouter</label>
      <input type="password" id="key_OPENROUTER_API_KEY" data-provider-key="OPENROUTER_API_KEY" placeholder="sk-or-...">
    </fieldset>

    <label for="model">Model</label>
    <input type="text" id="model" placeholder="openai/gpt-oss-120b">

    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="https://api.groq.com/openai/v1/chat/completions">

    <label for="targetSelector">Target Selector</label>
    <input type="text" id="targetSelector" placeholder='[contenteditable="true"]'>

    <p style="font-size:12px;color:#888;margin:12px 0 4px">
      To customize cues/blanks/controls, edit <code>~/.cues/</code> and run
      <code>opencues sync chrome --wsl</code>. See
      <a href="https://github.com/opencues/opencues/blob/master/docs/features/chrome-sync.md"
         target="_blank" rel="noopener">chrome-sync.md</a>.
    </p>

    <details>
      <summary style="font-size:12px;color:#888;cursor:pointer">Advanced</summary>
      <label for="finnhubApiKey">Finnhub API Key (stocks)</label>
      <input type="password" id="finnhubApiKey" placeholder="optional">
    </details>

    <div class="row">
      <label><input type="checkbox" id="ttsEnabled"> TTS</label>
      <label>Rate <input type="number" id="ttsRate" min="1" max="5" value="2" style="width:3em"></label>
    </div>

    <label for="dimMix">Dim fade <span id="dimMixValue" style="color:#888"></span></label>
    <input type="range" id="dimMix" min="0" max="100" step="5" value="45">

    <button id="save">Save</button>
    <button id="reset" style="background:#dc2626;margin-top:4px">Reset to Defaults</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
