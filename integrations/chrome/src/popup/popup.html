<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>OpenCues</h1>

    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="gsk_...">

    <label for="model">Model</label>
    <input type="text" id="model" placeholder="openai/gpt-oss-120b">

    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="https://api.groq.com/openai/v1/chat/completions">

    <label for="targetSelector">Target Selector</label>
    <input type="text" id="targetSelector" placeholder='[contenteditable="true"]'>

    <label for="cuesMd">cues.md</label>
    <textarea id="cuesMd" rows="5" placeholder="Paste cues.md content..."></textarea>

    <label for="blanksMd">blanks.md</label>
    <textarea id="blanksMd" rows="3" placeholder="Paste blanks.md content (optional)..."></textarea>

    <label for="opencuesMd">opencues.md</label>
    <textarea id="opencuesMd" rows="3" placeholder="Paste opencues.md content (optional)..."></textarea>

    <details>
      <summary style="font-size:12px;color:#888;cursor:pointer">Advanced</summary>
      <label for="finnhubApiKey">Finnhub API Key (stocks)</label>
      <input type="password" id="finnhubApiKey" placeholder="optional">
      <label for="tipsJson">Extra Tips JSON</label>
      <textarea id="tipsJson" rows="3" placeholder="Extra tips (tips are usually inline in cues.md)..."></textarea>
    </details>

    <div class="row">
      <label><input type="checkbox" id="ttsEnabled"> TTS</label>
      <label>Rate <input type="number" id="ttsRate" min="1" max="5" value="2" style="width:3em"></label>
    </div>

    <button id="save">Save</button>
    <button id="reset" style="background:#dc2626;margin-top:4px">Reset to Defaults</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
