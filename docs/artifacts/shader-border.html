<!-- ============================================================================
     Shader border — an 8px animated ring around the hero
     ----------------------------------------------------------------------------
     Runs a shader lifted from ShaderShop (~/ShaderShop) over a thin ring drawn
     around the hero demo. The shader body is VENDORED UNMODIFIED at
     shaders/foxfire.glsl and inlined here by build.cjs at the marker below —
     re-sync by copying the file again, never by editing it in place.

     Fed a FLAT MUSTARD image, exactly as ShaderShop feeds it a flat logo
     (img/cs-logo-dark.png, whose brand colour measures #FCC908). Foxfire buckets
     pixels by hue and pulses each bucket's ALPHA on a sine, so a flat fill makes
     the whole ring breathe as one — which is the effect at this width. A ring is
     8px; a displacement shader would have nothing to displace.

     ⚠ WEB ONLY, deliberately. The ring is not in the exported video and not in
     the PDF. The video renderer captures one frame per Chrome process against a
     virtual clock, so the ring could only change when the hero emitted a frame
     — 24 times across 17.6s, which reads as sporadic flashing, not motion.
     Smooth motion needs a real frame cadence, and every route to that on this
     machine is blocked: WSL cannot reach Windows Chrome's debug port, and a
     Linux Playwright chromium hangs at launch here. Batching frames into one
     canvas atlas worked but the DOM half could not follow (ImageMagick caps
     images at 16K pixels tall, and cloneNode does not carry canvas pixels).
     If a persistent browser ever becomes available, that is the thing to fix
     first — not this file.

     Under the video's virtual-time shim the ring would also hang the render: a
     self-perpetuating rAF re-queues at the same virtual time forever, starving
     the hero's timers. It paints on demand there instead, via
     window.__ocRingDraw(seconds).
     ============================================================================ -->
<script>
(function () {
  var HOST = document.querySelector('.hero');
  if (!HOST) return;
  /* The ring's own colour, measured off ShaderShop's base images. Foxfire
     passes the source RGB straight through and animates only alpha, so this
     is exactly what you see. */
  var MUSTARD = [252 / 255, 201 / 255, 8 / 255];
  /* The video stage scales the hero up, so it overrides this before the script
     runs; 8px is the page's value. */
  var RING = window.__OC_RING_PX || 8;   // px of ring, all four sides

  /* ---- canvas: PADDED, and offset to cancel the padding -------------------
     ShaderShop's source images have empty margin around the logo, which is
     what gives the displacement somewhere to push. Same here: the canvas is
     PAD larger than the hero on every side and the ring is drawn PAD in from
     its edge, so the ring still lands exactly on the hero's border while the
     shader has room to move it.

     The canvas therefore cannot be a child of .hero (overflow:hidden would
     clip the padding away). It is positioned against the hero's offset parent
     instead. NOTE: an earlier version reparented .hero into a wrapper to solve
     the same problem and silently broke the video stage, where .hero is a flex
     child the stage sizes. This touches no layout — nothing moves, a sibling is
     simply painted over the top. */
  /* The canvas is deliberately MUCH bigger than the border it draws. The
     shader displaces what it samples, and it can only push pixels into space
     that exists — a canvas hugging the border gives it nowhere to go, so the
     effect reads as a clipped band rather than something bleeding over and
     into the shape. This is the room. */
  var PAD = RING * 8;
  var parent = HOST.offsetParent || HOST.parentNode;
  if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';

  var cv = document.createElement('canvas');
  cv.setAttribute('aria-hidden', 'true');
  /* mix-blend-mode:screen is what makes this work. The shader's output is
     amber ON BLACK, and screen maps black to "no change" — so the dark parts
     fall away and only the amber lands on the page. That means the texture can
     be plain opaque black behind the shape (no alpha juggling), and the shader
     can render across the WHOLE canvas without being clipped to a border. */
  cv.style.cssText = 'position:absolute;pointer-events:none;z-index:2;' +
    'mix-blend-mode:screen';
  parent.appendChild(cv);

  function place() {
    cv.style.left   = (HOST.offsetLeft - PAD) + 'px';
    cv.style.top    = (HOST.offsetTop  - PAD) + 'px';
    cv.style.width  = (HOST.offsetWidth  + PAD * 2) + 'px';
    cv.style.height = (HOST.offsetHeight + PAD * 2) + 'px';
  }
  place();

  var GLOPTS = { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true };
  var gl = cv.getContext('webgl2', GLOPTS) || cv.getContext('webgl', GLOPTS);
  if (!gl) return;                    // no WebGL: no ring, page is unaffected

  /* ---- the shader ---------------------------------------------------------
     The preamble is ours; everything between it and main() is the vendored
     shader as shipped. THE RING IS THE IMAGE, not a mask: the texture is a
     solid amber ring on transparent black, and the shader displaces it. So
     main() does not clip to a band — clipping would cut off exactly the
     wobble the shader exists to produce. The interior stays clear because the
     texture is transparent there. */
  var FRAG =
    'precision highp float;\n' +
    'uniform vec3 iResolution;\n' +
    'uniform float iTime;\n' +
    'uniform sampler2D iChannel0;\n' +

    /*__SHADER_FOXFIRE__*/
    '\n' +
    /* The shader runs UNCONSTRAINED across the whole canvas — its look comes
       from displacing a real image, and shaping its input into a ring just
       shredded it. The border is a WINDOW onto that: keep the outer band, drop
       the middle so the demo shows through. The shader's own square-image
       aspect correction is left alone; with REPEAT wrapping, the logo tiles
       across the wide canvas instead of collapsing to the centre. */
    /* The shader aspect-corrects its own uv for a SQUARE source image:
         uv.x = (uv.x - 0.5) * aspect + 0.5
       On a wide canvas that expands x about the centre, so only the middle
       ~18% of the width maps into the texture — measured: the ring rendered as
       a small box mid-frame. Rather than edit the vendored file, pass it a
       PRE-INVERTED coordinate so its own correction cancels exactly and uv
       comes out as true screen uv. Any square-assuming shader needs this.
       Alpha is forced to 1: the screen blend is what removes the black, so the
       shader's own alpha must not also punch holes in the result. */
    'void main() {\n' +
    '  vec2 s = gl_FragCoord.xy / iResolution.xy;\n' +
    '  float A = iResolution.x / iResolution.y;\n' +
    '  vec2 q = A > 1.0 ? vec2((s.x - 0.5) / A + 0.5, s.y)\n' +
    '                   : vec2(s.x, (s.y - 0.5) * A + 0.5);\n' +
    '  vec4 c; mainImage(c, q * iResolution.xy);\n' +
    '  gl_FragColor = vec4(c.rgb, 1.0);\n' +
    '}\n';

  var VERT = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      /* Loud, not silent: a shader that fails to compile is otherwise an
         invisible no-op, and the ring simply never appears. */
      var log = gl.getShaderInfoLog(s);
      console.error('[shader-border] compile failed:', log);
      window.__ocRingError = 'compile: ' + log;
      return null;
    }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('[shader-border] link failed:', gl.getProgramInfoLog(prog));
    window.__ocRingError = 'link: ' + gl.getProgramInfoLog(prog);
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  /* ---- the input image: an amber shape on black ----------------------------
     What the shader wants is an amber THING to act on — ShaderShop feeds it a
     logo on near-black. Here the thing is the ring. The ground is opaque black
     rather than transparent, because the canvas composites with screen: black
     contributes nothing, so it disappears on its own and there is no alpha to
     manage.

     The ring is drawn PAD in from the texture edge, which is exactly how far
     the canvas overhangs the hero — so it lands on the hero's border, and the
     margin gives the displacement somewhere to push, the way the empty space
     around ShaderShop's logo does. */
  var texCv = document.createElement('canvas');
  var tex = gl.createTexture();

  function buildRingTexture(w, h, ringPx, padPx) {
    texCv.width = w; texCv.height = h;
    var tx = texCv.getContext('2d');
    tx.fillStyle = '#000';
    tx.fillRect(0, 0, w, h);
    tx.strokeStyle = 'rgb(252,201,8)';
    tx.lineWidth = ringPx;
    tx.strokeRect(padPx + ringPx / 2, padPx + ringPx / 2,
                  w - 2 * padPx - ringPx, h - 2 * padPx - ringPx);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texCv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  var U = {};
  ['iResolution', 'iTime', 'iChannel0'].forEach(function (n) {
    U[n] = gl.getUniformLocation(prog, n);
  });
  gl.uniform1i(U.iChannel0, 0);

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    place();
    var w = Math.round((HOST.offsetWidth + PAD * 2) * dpr);
    var h = Math.round((HOST.offsetHeight + PAD * 2) * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform3f(U.iResolution, cv.width, cv.height, 1);
    if (texCv.width !== cv.width || texCv.height !== cv.height) {
      buildRingTexture(cv.width, cv.height, RING * dpr, PAD * dpr);
    }
  }

  function draw(seconds) {
    size();
    gl.uniform1f(U.iTime, seconds);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* Always exposed, not just under the shim: it is how the video driver paints
     a frame, and it is the only way to inspect the ring at a KNOWN phase.
     Sampling it under headless virtual time otherwise reads whatever moment the
     clock happened to freeze at, which looks like a bug in the ring. */
  window.__ocRingDraw = draw;

  /* Under the virtual-time shim, paint on demand only — see the warning above. */
  if (window.__ocRun) { draw(0); return; }

  var t0 = null;
  (function loop(t) {
    if (t0 === null) t0 = t;
    draw((t - t0) / 1000);
    requestAnimationFrame(loop);
  })(0);
})();
</script>
