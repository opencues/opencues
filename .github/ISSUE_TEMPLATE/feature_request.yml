name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or friction you're hitting. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? A new cue/blank, a setting, a host, a spec change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cues (word / sentence alternatives)
        - Blanks (`_` fills)
        - A host integration
        - LLM providers / routing
        - The open standard (spec)
        - CLI / install
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you tried or ruled out.
