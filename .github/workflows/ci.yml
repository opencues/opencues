name: CI

# paths-ignore skips CI entirely on PRs that only touch documentation,
# changelog, license, or other repo metadata. The filter fires only when
# EVERY changed file matches — a PR that mixes source + docs still runs
# full CI. Doc-only PRs see the checks count as "skipped" (NOT "passed");
# branch protection's required-checks list needs adjusting accordingly,
# or doc-only PRs will be blocked until the required checks pass.
#
# Saved a full CI run for ≈30% of the recent PRs in this repo
# (#143, #144, #149's CHANGELOG were the canonical doc-only shapes).
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "spec/**"
      - "blog-resources/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "spec/**"
      - "blog-resources/**"
      - "LICENSE"

# Cancel older runs of the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── build · typecheck · test + hermeticity (merged) ──────────────────
  # The previously-separate `test-hermeticity` job did the same install +
  # build + run-tests sequence as this one, just with HOME pointed at a
  # tempdir. Merging them saves a whole job's worth of runner-minutes
  # (≈90s on a cold cache, ≈30s warm) and removes the rebuild that ran
  # twice in parallel. The hermeticity check still runs the same scripts
  # — it just shares the install + build with the rest of the job.
  build-and-test:
    name: build · typecheck · test + hermeticity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Runs the full test sweep under a sandboxed $HOME and asserts the
      # real ~/.opencues/ + ~/.cues/ are untouched. Covers `pnpm -r test`
      # AND the CLI's own `npm test` target. CI runners don't normally
      # have either dir, so the diff is vacuous — the HOME override is
      # the load-bearing contract. PR #41 (June 2026) caught
      # vendor-pins.test.cjs wiping the user's tmux dir; this gate
      # structurally prevents the regression class.
      - name: Test + hermeticity (sandboxed HOME)
        run: bash scripts/check-test-hermeticity.sh

      - name: Test (CLI integration)
        run: |
          cd packages/opencues-cli
          npm run test:integration
        env:
          # Tests should never need a real LLM key. If a unit test
          # requires one, that's the bug — file it instead of unsetting
          # this. Existing tests use mocked providers.
          GROQ_API_KEY: ""
          CEREBRAS_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""

  # ── lints (no install needed) ────────────────────────────────────────
  shell-portability:
    name: shell portability lint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    # Catches the macOS/BSD regressions the May 2026 sweep fixed before
    # they re-land. Rules live in CLAUDE.md § "Cross-platform shell
    # scripts"; the lint enforces the hard bans (bash-4 features,
    # GNU-only coreutils flags, ungated /proc reads, raw sed -i,
    # orchestrator scripts missing `set -o pipefail`).
    steps:
      - uses: actions/checkout@v4
      - name: Run portability lint
        run: bash scripts/lint-shell-portability.sh

  legacy-names:
    name: legacy-names lint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    # Catches the rename-drift class — old feature names lingering in
    # shipping code after a rename (`SENTINELS.md`/`USER.md`/
    # `sentinels-mode`/`opencues sentinels` are the current bans).
    # See CLAUDE.md § "Rename discipline" + the BANNED_PATTERNS list
    # at the top of scripts/lint-legacy-names.sh.
    steps:
      - uses: actions/checkout@v4
      - name: Run legacy-names lint
        run: bash scripts/lint-legacy-names.sh

  # ── install-dependent gates ──────────────────────────────────────────
  cc-patch-boot-smoke:
    name: CC patch boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # Evaluates the CC patch's emitted JS in a Node vm sandbox to catch
    # identifier scope errors that source-level typechecks can't see.
    # June 2026 cc38ab8 shipped `blanks: __ocReg` where __ocReg was
    # IIFE-local — ReferenceError on every keystroke, swallowed by the
    # patch's own catch, OpenCues silently dead. Source compiled fine,
    # patch applied fine, bundle parsed fine — only the runtime
    # evaluation surfaced the bug. This job runs that evaluation in CI.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run CC patch boot smoke
        run: node scripts/check-cc-patch-boot.cjs

  runtime-bun-load:
    name: runtime loads on bun
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # Asserts @opencues/runtime's user-blanks registry imports cleanly
    # under Bun — opencode + shell both run on Bun, so any top-level
    # Node-V8 native import (e.g. isolated-vm) crashes them at boot
    # with "undefined symbol" before any try/catch can fire. Tests
    # run on Node, so this gate is the only structural protection.
    # b460076 isolated-vm migration (June 2026) is the canonical
    # incident — every opencode + shell user crashed at boot for hours.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build @opencues/{core,runtime}
        run: pnpm --filter @opencues/core --filter @opencues/runtime build
      - name: Probe runtime load under Bun
        run: bash scripts/check-runtime-loads-on-bun.sh

  cc-bundle-integrity:
    name: CC fork bundle integrity
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # Asserts every require path the CC patch's bootstrap pulls is
    # reachable from a freshly-assembled fork (the bundle setup.sh
    # would copy into ~/claude-code-cues/node_modules/@opencues/).
    # Bug class this guards: a PR adds a new file/subdir under
    # packages/opencues-{core,runtime}/dist/ but setup.sh's copy step
    # misses it; installed model-aliases.js then requires a missing
    # module; CC patch's outer try/catch sets __oc.failed=true; user
    # has no cues + no blanks + no log line + no install error. June
    # 2026 PR #117 (providers/claude-cli-daemon) is the canonical
    # incident — silent breakage on every user's CC session for
    # hours. The script assembles the exact bundle setup.sh ships, then
    # runs `require()` from a clean NODE_PATH (so workspace hoisting
    # can't mask missing transitive deps) for every spec the CC patch
    # references.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - name: Build @opencues/{core,runtime}
        run: pnpm --filter @opencues/core --filter @opencues/runtime build
      - name: Probe CC fork bundle integrity
        run: bash scripts/check-cc-bundle-integrity.sh

  version-bump-gate:
    name: version-bump gate
    runs-on: ubuntu-latest
    timeout-minutes: 2

    # Asserts that PRs touching `packages/<pkg>/src/**` also bump the
    # corresponding `packages/<pkg>/package.json` version. The
    # srcHash-driven self-heal (PR #42) means version bumps are no
    # longer load-bearing for drift detection, but they remain
    # required for npm publish + changelog discoverability.
    # PRs #37-#41 all shipped without bumps before this gate existed.
    # Bypass per-PR with the commit-message marker `[skip version-bump]`.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need master ref for the diff base
      - name: Run version-bump gate
        run: bash scripts/lint-version-bump.sh
        env:
          BASE: origin/master

  chrome-bundle-check:
    name: chrome bundle artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # Asserts every Chrome dist artifact the manifest depends on
    # actually exists with non-trivial size after `pnpm build`.
    # Catches the PR #47 → #49 failure mode where a runtime import
    # silently broke the chrome bundle while every other host built
    # fine. Tied to `pnpm build` so it runs after the same turbo
    # pipeline the main job uses.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"
      - name: pnpm build
        run: pnpm build
      - name: Check chrome bundle
        run: bash scripts/check-chrome-bundle.sh
